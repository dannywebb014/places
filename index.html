<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>places.</title>
  <meta name="description" content="Our map of places to eat, visit and do.">
  <!-- Send Google the full page address, not just the site root, so the API
       key can stay restricted to /places/. Search requests fail otherwise. -->
  <meta name="referrer" content="no-referrer-when-downgrade">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1d22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="places.">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f4f1ea; --card:#fffdf8; --input:#f0ece3; --border:#ddd8cc; --line:#e8e3d8;
      --text:#2d2a24; --muted:#7a756a; --dim:#a8a295;
      --accent:#b8436d; --accent-hover:#9d3459; --accent-soft:#b8436d14; --accent-text:#a63a61;
      --danger:#b54e4e; --danger-soft:#b54e4e12; --good:#3f7a4a; --good-soft:#3f7a4a16;
      --shadow:0 2px 10px rgba(40,30,20,.12); --shadow-sm:0 1px 3px rgba(0,0,0,.08);
      --panel:400px; --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#1a1d22; --card:#23272d; --input:#2c3139; --border:#3a4049; --line:#30353d;
        --text:#e6e8eb; --muted:#9aa2ad; --dim:#6b737e;
        --accent:#c4507b; --accent-hover:#d4658e; --accent-soft:#e0789f24; --accent-text:#ec93b5;
        --danger:#c96b6b; --danger-soft:#c96b6b1f; --good:#7cc48a; --good-soft:#7cc48a1f;
        --shadow:0 2px 12px rgba(0,0,0,.45); --shadow-sm:0 1px 3px rgba(0,0,0,.3);
      }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; }
    body {
      margin:0; overflow:hidden; background:var(--bg); color:var(--text);
      font-family:'Source Sans 3',system-ui,sans-serif; font-size:16px; line-height:1.4;
    }
    button, input, textarea, select { font:inherit; color:inherit; }
    button { cursor:pointer; }
    [hidden] { display:none !important; }

    /* ── Sign in ── */
    .login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); z-index:50; }
    .login form { width:100%; max-width:360px; }
    .login h1 { font-family:'Lora',serif; font-style:italic; font-weight:600; font-size:44px; margin:0 0 4px; text-align:center; letter-spacing:-1px; }
    .login p { color:var(--muted); text-align:center; margin:0 0 24px; }
    .field { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--card); font-size:16px; outline:none; margin-bottom:10px; }
    .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .login .error { color:var(--danger); font-size:14px; min-height:20px; margin:4px 0 8px; text-align:center; }

    .logo-dot { color:var(--accent); font-style:normal; }

    /* ── Map ── */
    /* Google sets position:relative on the map element itself, so the
       full-screen positioning lives on a wrapper and the map fills it. */
    .map-wrap { position:fixed; inset:0; background:var(--input); }
    #map { width:100%; height:100%; }
    .pin {
      width:18px; height:18px; border-radius:50%; background:var(--c); border:2.5px solid #fff;
      box-shadow:0 1px 4px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; color:#fff;
      transition:transform .15s;
    }
    .pin.done { opacity:.55; width:20px; height:20px; }
    .pin.suggestion { width:14px; height:14px; background:#fff; border:3px solid var(--c); }
    .pin.selected { transform:scale(1.45); }
    .pin.draft { width:22px; height:22px; animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform:scale(1.25); } }
    .me { width:16px; height:16px; border-radius:50%; background:#2f7df6; border:3px solid #fff; box-shadow:0 0 0 6px rgba(47,125,246,.2); }

    /* ── Top bar ── */
    .top { position:fixed; top:calc(var(--safe-top) + 10px); left:12px; right:12px; z-index:10; }
    .top-row { display:flex; gap:8px; }
    .search { position:relative; flex:1; }
    .search input {
      width:100%; height:46px; padding:0 14px 0 40px; border-radius:23px; border:1px solid var(--border);
      background:var(--card); box-shadow:var(--shadow); outline:none; font-size:16px;
    }
    .search input:focus { border-color:var(--accent); }
    .search > svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--dim); pointer-events:none; }
    .round {
      width:46px; height:46px; flex-shrink:0; border-radius:50%; border:1px solid var(--border); background:var(--card);
      box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; color:var(--muted);
    }
    .results {
      position:absolute; top:52px; left:0; right:0; background:var(--card); border:1px solid var(--border);
      border-radius:14px; box-shadow:var(--shadow); overflow:hidden; max-height:60dvh; overflow-y:auto;
    }
    .result { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:11px 14px; border:none; background:none; border-bottom:1px solid var(--line); }
    .result:last-child { border-bottom:none; }
    .result:active, .result.hl { background:var(--accent-soft); }
    .result .main { font-weight:600; }
    .result .sec { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .result .txt { min-width:0; flex:1; }
    .result .tag { font-size:11px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:var(--accent-text); }
    .results .note { padding:10px 14px; font-size:13px; color:var(--muted); }

    .chips { display:flex; gap:6px; overflow-x:auto; padding:10px 2px 4px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip {
      flex-shrink:0; display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:16px;
      border:1px solid var(--border); background:var(--card); box-shadow:var(--shadow-sm); font-size:14px; font-weight:600; color:var(--muted);
      white-space:nowrap;
    }
    .chip .dot { width:9px; height:9px; border-radius:50%; background:var(--c); }
    .chip.on { color:var(--text); border-color:var(--c, var(--accent)); box-shadow:inset 0 0 0 1px var(--c, var(--accent)); }
    .chip.off-all .dot { opacity:1; }

    .locate { position:fixed; right:12px; bottom:calc(var(--sheet-h) + 12px); z-index:9; transition:bottom .25s ease; }

    /* ── Panel: a bottom sheet on phones, a side panel on wide screens ── */
    body { --sheet-h:170px; }
    body[data-sheet=half] { --sheet-h:52dvh; }
    body[data-sheet=full] { --sheet-h:86dvh; }
    .sheet {
      position:fixed; left:0; right:0; bottom:0; height:calc(var(--sheet-h) + var(--safe-bottom)); z-index:20;
      background:var(--bg); border-radius:18px 18px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.14);
      display:flex; flex-direction:column; transition:height .25s ease;
    }
    .grab { padding:8px 0 2px; display:flex; justify-content:center; touch-action:none; cursor:grab; flex-shrink:0; }
    .grab span { width:40px; height:5px; border-radius:3px; background:var(--border); }
    .sheet-head { display:flex; align-items:center; gap:8px; padding:4px 16px 8px; flex-shrink:0; }
    .tabs { display:flex; gap:4px; background:var(--input); padding:3px; border-radius:11px; flex:1; }
    .tab { flex:1; height:34px; border:none; border-radius:9px; background:none; font-weight:600; font-size:15px; color:var(--muted); }
    .tab.on { background:var(--card); color:var(--text); box-shadow:var(--shadow-sm); }
    .back { display:flex; align-items:center; gap:4px; border:none; background:none; color:var(--accent-text); font-weight:600; padding:6px 4px; }
    .sheet-body { flex:1; overflow-y:auto; padding:0 16px calc(16px + var(--safe-bottom)); -webkit-overflow-scrolling:touch; }
    .brand { font-family:'Lora',serif; font-style:italic; font-weight:600; font-size:24px; letter-spacing:-.5px; display:none; }

    @media (min-width: 860px) {
      body, body[data-sheet] { --sheet-h:0px; }
      .sheet { top:0; right:auto; width:var(--panel); height:100%; border-radius:0; box-shadow:2px 0 18px rgba(0,0,0,.12); padding-top:var(--safe-top); }
      .grab { display:none; }
      .map-wrap { left:var(--panel); }
      .top { left:calc(var(--panel) + 14px); right:14px; max-width:560px; }
      .locate { bottom:20px; right:16px; }
      .brand { display:block; padding:14px 16px 4px; }
      .toast { left:calc(50% + var(--panel) / 2); bottom:24px; }
    }

    /* ── Rows and cards ── */
    .row { display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
    .row:last-child { border-bottom:none; }
    .row .dot { width:12px; height:12px; border-radius:50%; background:var(--c); flex-shrink:0; }
    .row .txt { flex:1; min-width:0; }
    .row .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row .sub { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row.done .name { color:var(--muted); }
    .row .end { font-size:13px; color:var(--dim); flex-shrink:0; text-align:right; }
    .been { color:var(--good); font-weight:700; }
    .add-btn {
      flex-shrink:0; height:32px; padding:0 12px; border-radius:16px; border:1px solid var(--accent); background:none;
      color:var(--accent-text); font-weight:700; font-size:14px;
    }
    .saved-tag { flex-shrink:0; font-size:13px; font-weight:600; color:var(--good); }
    .empty { color:var(--muted); text-align:center; padding:22px 8px; font-size:15px; }
    .count { font-size:13px; color:var(--muted); margin:2px 2px 4px; }
    .section-label { font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--dim); margin:16px 2px 4px; }

    .detail h2 { font-family:'Lora',serif; font-weight:600; font-size:23px; margin:2px 0 2px; line-height:1.2; }
    .detail .kind { color:var(--muted); font-size:14px; }
    .detail .addr { color:var(--muted); font-size:14px; margin-top:6px; }
    .facts { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px; }
    .fact { font-size:13px; font-weight:600; padding:4px 10px; border-radius:12px; background:var(--input); color:var(--muted); }
    .fact.yes { background:var(--good-soft); color:var(--good); }
    .fact.star { color:var(--text); }
    .label { font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; }
    .list-picks { display:flex; flex-wrap:wrap; gap:6px; }
    .list-picks .chip { box-shadow:none; }
    textarea.field { min-height:70px; resize:vertical; margin:0; font-size:15px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
    .btn {
      height:42px; padding:0 16px; border-radius:11px; border:1px solid var(--border); background:var(--card);
      font-weight:600; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; color:var(--text);
    }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn.primary:disabled { opacity:.5; }
    .btn.wide { flex:1; }
    .btn.good { background:var(--good); border-color:var(--good); color:#fff; }
    .btn.danger { color:var(--danger); border-color:transparent; background:none; padding:0 6px; }
    .visit { margin-top:18px; padding:14px; border-radius:14px; background:var(--card); border:1px solid var(--border); }
    .visit .head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .stars { display:flex; gap:2px; }
    .stars button { border:none; background:none; padding:2px; font-size:26px; line-height:1; color:var(--border); }
    .stars button.on { color:#e0a526; }
    .stars.small { font-size:15px; color:#e0a526; letter-spacing:1px; }
    .visit input[type=date] { width:auto; margin:0; }
    .visit-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0; }

    .seg { display:flex; gap:4px; background:var(--input); padding:3px; border-radius:11px; margin-bottom:8px; }
    .seg button { flex:1; height:36px; border:none; border-radius:9px; background:none; font-weight:600; font-size:14px; color:var(--muted); }
    .seg button.on { background:var(--card); color:var(--text); box-shadow:var(--shadow-sm); }
    .hint { font-size:13px; color:var(--muted); margin:6px 2px 0; }

    .toast {
      position:fixed; left:50%; bottom:calc(var(--sheet-h) + var(--safe-bottom) + 14px); transform:translate(-50%, 20px); opacity:0; z-index:60;
      background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:15px; font-weight:600;
      box-shadow:var(--shadow); transition:opacity .2s, transform .2s; pointer-events:none; max-width:calc(100% - 32px); text-align:center;
    }
    .toast.show { opacity:1; transform:translate(-50%, 0); }
    .toast.err { background:var(--danger); color:#fff; }

    .list-edit { display:flex; align-items:center; gap:8px; padding:6px 0; }
    .list-edit input[type=color] { width:34px; height:34px; border:none; padding:0; background:none; border-radius:50%; flex-shrink:0; }
    .list-edit input[type=text] { margin:0; height:40px; padding:0 12px; }
    .usage { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:15px; }
    .usage b { font-weight:700; }
    .meter { height:6px; border-radius:3px; background:var(--input); overflow:hidden; margin-top:6px; }
    .meter span { display:block; height:100%; background:var(--accent); }
  </style>
</head>
<body data-sheet="peek">
  <div class="login" id="login" hidden>
    <form id="login-form">
      <h1>places<span class="logo-dot">.</span></h1>
      <p>Sign in with your food. account.</p>
      <input class="field" type="email" name="email" placeholder="Email" autocomplete="username" required>
      <input class="field" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <div class="error" id="login-error"></div>
      <button class="btn primary wide" style="width:100%">Sign in</button>
    </form>
  </div>

  <div class="map-wrap"><div id="map"></div></div>

  <div class="top" id="top" hidden>
    <div class="top-row">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="search" placeholder="Search or add a place" autocomplete="off" enterkeyhint="search">
        <div class="results" id="results" hidden></div>
      </div>
      <button class="round" id="open-settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <button class="round locate" id="locate" aria-label="Show where I am" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
  </button>

  <section class="sheet" id="sheet" hidden>
    <div class="brand">places<span class="logo-dot">.</span></div>
    <div class="grab" id="grab"><span></span></div>
    <div class="sheet-head" id="sheet-head"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
